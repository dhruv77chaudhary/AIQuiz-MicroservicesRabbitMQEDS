spring:
  application:
    name: question-generator
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  data:
    mongodb:
      uri: mongodb://localhost:27017/questiondb

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    function:
      definition: getQuizBinding
      web:
        path: "/functions"  #chnages url path
    stream:
      bindings:
        getQuizBinding-in-0:
          destination: quiz-created
          group: ${spring.application.name}
        getQuizBinding-out-0:
          destination: acknowledge-quiz
          group: ${spring.application.name}
server:
  port: 9097

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true