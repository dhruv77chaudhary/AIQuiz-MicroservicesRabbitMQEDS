spring:
  application:
    name: quiz-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/quiz

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 9092

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true