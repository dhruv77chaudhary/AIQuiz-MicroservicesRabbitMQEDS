spring.application.name=api-gateway
server.port=9093
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
#actuator
management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=READ_ONLY
management.info.env.enabled=true
#configserver
spring.cloud.config.server.native.search-locations=classpath:/config
#config client
spring.config.import=configserver:http://localhost:9094
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:8080/realms/dev/protocol/openid-connect/certs
